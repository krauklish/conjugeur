<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conjugeur — prototype</title>
<style>
  /* Design prototype: all data is mocked inline. Three type styles only:
     .t-display (sentence, titles), body (default), .t-caption (labels). */
  :root {
    --ink: #000;
    --paper: #fff;
    --accent: #1440ff;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 400 18px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100dvh;
  }
  .t-display { font-size: clamp(30px, 8.4vw, 44px); line-height: 1.28; font-weight: 500; letter-spacing: -0.015em; }
  .t-caption { font-size: 13px; line-height: 1.3; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
  button, input { font: inherit; color: inherit; letter-spacing: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  .app { max-width: 620px; margin: 0 auto; padding: 0 20px 40px; }

  /* Navigation: text only */
  nav { display: flex; gap: 22px; align-items: baseline; padding: 18px 0 16px; border-bottom: 1px solid var(--ink); }
  nav button { padding: 4px 0; border-bottom: 2px solid transparent; transition: border-color .25s var(--ease), color .25s var(--ease); }
  nav button[aria-current="page"] { border-bottom-color: var(--accent); color: var(--accent); }
  nav .score { margin-left: auto; font-variant-numeric: tabular-nums; }

  /* Views */
  .view { padding-top: 36px; transition: opacity .2s var(--ease), transform .2s var(--ease); }
  .view[hidden] { display: none; }
  .view.is-leaving, .view.is-entering { opacity: 0; transform: translateY(6px); }

  /* Practice */
  .sentence { transition: opacity .18s var(--ease), transform .18s var(--ease); }
  .sentence.is-out { opacity: 0; transform: translateY(-10px); }
  .sentence.is-in { opacity: 0; transform: translateY(10px); transition: none; }
  .blank-wrap { display: inline-block; position: relative; vertical-align: baseline; }
  .blank {
    width: 4ch; min-width: 4ch; max-width: 100%;
    padding: 0 2px; border: 0; border-bottom: 3px solid var(--ink); border-radius: 0;
    background: transparent; outline: none; caret-color: var(--accent);
    font-size: inherit; line-height: inherit; font-weight: inherit; text-align: center;
    transition: border-color .2s var(--ease), color .2s var(--ease), width .12s var(--ease);
  }
  .blank:focus { border-bottom-color: var(--accent); }
  .is-correct .blank, .is-almost .blank { color: var(--accent); border-bottom-color: var(--accent); }
  .is-wrong .blank { text-decoration: line-through; text-decoration-thickness: 2px; border-bottom-color: var(--ink); }
  .is-shaking .blank-wrap { animation: shake .32s var(--ease); }
  @keyframes shake { 20% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 80% { transform: translateX(-3px); } }
  .mirror { position: absolute; visibility: hidden; white-space: pre; left: 0; top: 0; pointer-events: none; }

  .hint { margin-top: 18px; transition: opacity .18s var(--ease); }
  .sentence.is-out + .hint, .sentence.is-in + .hint { opacity: 0; }

  /* Feedback: height animates open via grid rows */
  .feedback { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .3s var(--ease), opacity .3s var(--ease); }
  .feedback > div { overflow: hidden; }
  .is-checked .feedback { grid-template-rows: 1fr; opacity: 1; }
  .feedback .verdict { padding-top: 28px; }
  .is-correct .verdict, .is-almost .verdict { color: var(--accent); }
  .feedback .answer { color: var(--accent); margin-top: 6px; }
  .feedback .answer:empty { display: none; }
  .feedback .why { margin-top: 12px; }
  .feedback .why p + p { margin-top: 6px; }

  .action {
    display: block; width: 100%; margin-top: 32px; padding: 16px; border: 1px solid var(--ink);
    transition: background-color .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease);
  }
  .is-checked .action { background: var(--ink); color: var(--paper); }
  .action:active { background: var(--accent); border-color: var(--accent); color: var(--paper); }
  .empty { margin-top: 12px; }

  /* Settings */
  h1 { margin-bottom: 28px; }
  section + section { margin-top: 36px; }
  .row { display: flex; align-items: baseline; gap: 16px; margin-bottom: 12px; }
  .row .links { margin-left: auto; display: flex; gap: 16px; }
  .row .links button { border-bottom: 1px solid var(--ink); }
  .group { margin-top: 18px; }
  .group > .t-caption { display: block; margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 14px; border: 1px solid var(--ink);
    transition: background-color .18s var(--ease), color .18s var(--ease);
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  /* Progress */
  .list { list-style: none; padding: 0; border-top: 1px solid var(--ink); }
  .list li { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--ink); }
  .list li span:last-child { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 0; text-align: right; border-bottom: 1px solid var(--ink); font-weight: 400; }
  th:first-child, td:first-child { text-align: left; }
  td:first-child { text-transform: none; letter-spacing: 0; font-size: 18px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="t-caption" aria-label="Navigation">
    <button data-view="practice" aria-current="page">Exercice</button>
    <button data-view="settings">Réglages</button>
    <button data-view="progress">Progrès</button>
    <span class="score" id="score" aria-label="Réponses justes sur total">0 / 0</span>
  </nav>

  <!-- Exercice -->
  <main class="view" id="view-practice">
    <form id="exercise" autocomplete="off" novalidate>
      <p class="sentence t-display" id="sentence">
        <span id="before"></span><span class="blank-wrap"><span class="mirror" id="mirror" aria-hidden="true"></span><input
          class="blank" id="answer" type="text" lang="fr" inputmode="text" enterkeyhint="go"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
          aria-label="Votre réponse"></span><span id="after"></span>
      </p>
      <p class="hint t-caption" id="hint"></p>

      <div class="feedback" aria-live="polite">
        <div>
          <p class="verdict t-caption" id="verdict"></p>
          <p class="answer t-display" id="correct"></p>
          <div class="why" id="why"></div>
        </div>
      </div>

      <button class="action" id="action" type="submit">Vérifier</button>
    </form>
    <p class="empty" id="empty" hidden>Choisissez au moins un verbe et une forme dans les réglages.</p>
  </main>

  <!-- Réglages -->
  <main class="view" id="view-settings" hidden>
    <h1 class="t-display">Réglages</h1>
    <section>
      <div class="row"><span class="t-caption">Formes</span></div>
      <div id="forms"></div>
    </section>
    <section>
      <div class="row">
        <span class="t-caption">Verbes</span>
        <span class="links t-caption"><button type="button" data-all="1">Tous</button><button type="button" data-all="0">Aucun</button></span>
      </div>
      <div class="chips" id="verbs"></div>
    </section>
  </main>

  <!-- Progrès -->
  <main class="view" id="view-progress" hidden>
    <h1 class="t-display">Progrès</h1>
    <section>
      <p id="summary"></p>
    </section>
    <section>
      <div class="row"><span class="t-caption">À revoir</span></div>
      <ul class="list" id="weak"></ul>
    </section>
    <section>
      <div class="row"><span class="t-caption">Réussite par verbe et par forme, en %</span></div>
      <table class="t-caption" id="matrix"></table>
    </section>
  </main>
</div>

<script>
// ---------- Mock data ----------
const FORMS = [
  { id: 'ind.present', mood: 'Indicatif', label: 'Présent', short: 'Prés.' },
  { id: 'ind.pc', mood: 'Indicatif', label: 'Passé composé', short: 'P. c.' },
  { id: 'ind.imparfait', mood: 'Indicatif', label: 'Imparfait', short: 'Imp.' },
  { id: 'ind.futur', mood: 'Indicatif', label: 'Futur simple', short: 'Fut.' },
  { id: 'subj.present', mood: 'Subjonctif', label: 'Présent', short: 'S. pr.' },
  { id: 'subj.passe', mood: 'Subjonctif', label: 'Passé', short: 'S. pa.' },
];
const VERBS = ['être', 'avoir', 'faire', 'dire', 'pouvoir', 'aller', 'voir', 'savoir', 'vouloir', 'venir',
  'devoir', 'prendre', 'trouver', 'donner', 'falloir', 'parler', 'mettre', 'passer', 'croire', 'aimer'];

// alts: other real forms of the same verb a learner might type -> what they are.
const EXERCISES = [
  { verb: 'aller', form: 'ind.pc', before: 'Hier soir, elles ', after: ' au cinéma.', answers: ['sont allées'],
    cue: '« Hier soir » : action terminée à un moment précis du passé.',
    alts: { 'allaient': "l'imparfait", 'vont': 'le présent', 'iront': 'le futur simple', 'sont allés': 'le masculin : « elles » demande « allées »' } },
  { verb: 'faire', form: 'subj.present', before: 'Il faut que tu ', after: ' les courses.', answers: ['fasses'],
    cue: '« Il faut que » : nécessité, toujours suivie du subjonctif.',
    alts: { 'fais': "le présent de l'indicatif", 'feras': 'le futur simple' } },
  { verb: 'être', form: 'ind.imparfait', before: 'À cette époque-là, mon frère ', after: ' souvent en retard.', answers: ['était'],
    cue: '« À cette époque-là », « souvent » : habitude dans le passé.',
    alts: { 'a été': 'le passé composé', 'est': 'le présent' } },
  { verb: 'avoir', form: 'ind.futur', before: 'Quand tu rentreras, nous ', after: ' du temps libre.', answers: ['aurons'],
    cue: "« Quand » + futur : l'autre verbe se met aussi au futur simple.",
    alts: { 'avons': 'le présent', 'avions': "l'imparfait" } },
  { verb: 'venir', form: 'subj.passe', before: 'Je doute que Marie ', after: ' en train hier soir.', answers: ['soit venue'],
    cue: '« Je doute que » demande le subjonctif ; « hier soir » : fait passé.',
    alts: { 'vienne': 'le subjonctif présent', 'est venue': "le passé composé de l'indicatif", 'soit venu': 'le masculin : « Marie » demande « venue »' } },
  { verb: 'prendre', form: 'ind.present', before: 'Le lundi, mes parents ', after: ' le train.', answers: ['prennent'],
    cue: '« Le lundi » : habitude actuelle.',
    alts: { 'prenaient': "l'imparfait", 'prendront': 'le futur simple' } },
  { verb: 'pouvoir', form: 'ind.pc', before: 'Pendant deux ans, j’', after: ' travailler à la maison.', answers: ['ai pu'],
    cue: '« Pendant deux ans » : durée limitée et terminée.',
    alts: { 'pouvais': "l'imparfait", 'peux': 'le présent' } },
  { verb: 'savoir', form: 'subj.present', before: 'Je ne suis pas sûr que vous ', after: ' la réponse maintenant.', answers: ['sachiez'],
    cue: '« Je ne suis pas sûr que » : doute ; « maintenant » : fait actuel.',
    alts: { 'savez': "le présent de l'indicatif", 'ayez su': 'le subjonctif passé' } },
  { verb: 'voir', form: 'ind.futur', before: 'Un jour, on ', after: ' la mer, c’est sûr.', answers: ['verra'],
    cue: '« Un jour… c’est sûr » : prédiction.',
    alts: { 'voit': 'le présent', 'a vu': 'le passé composé' } },
  { verb: 'dire', form: 'ind.imparfait', before: 'Autrefois, tu ', after: ' bonjour aux voisins tous les jours.', answers: ['disais'],
    cue: '« Autrefois », « tous les jours » : habitude dans le passé.',
    alts: { 'as dit': 'le passé composé', 'dis': 'le présent' } },
  { verb: 'vouloir', form: 'ind.present', before: 'En ce moment, ils ', after: ' acheter une voiture.', answers: ['veulent'],
    cue: '« En ce moment » : situation actuelle.',
    alts: { 'voulaient': "l'imparfait", 'veuillent': 'le subjonctif présent' } },
  { verb: 'mettre', form: 'subj.present', before: 'J’aimerais que nous ', after: ' la table.', answers: ['mettions'],
    cue: '« J’aimerais que » : souhait, toujours suivi du subjonctif.',
    alts: { 'mettons': "le présent de l'indicatif", 'mettrons': 'le futur simple' } },
];

// ---------- State ----------
const state = {
  phase: 'answering',           // 'answering' | 'checked'
  current: null,
  queue: [],
  right: 0, total: 0,
  forms: new Set(FORMS.map((f) => f.id)),
  verbs: new Set(VERBS),
};
const $ = (id) => document.getElementById(id);
const form = $('exercise'), input = $('answer'), sentence = $('sentence');
const formOf = (id) => FORMS.find((f) => f.id === id);
const fullLabel = (f) => `${f.mood} · ${f.label}`;

// ---------- Practice ----------
const normalize = (s) => s.normalize('NFC').toLowerCase().replace(/[’‘ʼ]/g, "'").trim().replace(/\s+/g, ' ');
const stripAccents = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '');

function pool() {
  return EXERCISES.filter((e) => state.forms.has(e.form) && state.verbs.has(e.verb));
}
function nextExercise() {
  const p = pool();
  if (!p.length) return null;
  state.queue = state.queue.filter((e) => p.includes(e));
  if (!state.queue.length) {
    state.queue = p.slice().sort(() => Math.random() - 0.5);
    if (state.queue.length > 1 && state.queue[0] === state.current) state.queue.push(state.queue.shift());
  }
  return state.queue.shift();
}
function fitInput() {
  const mirror = $('mirror');
  mirror.textContent = input.value || '';
  input.style.width = input.value ? `calc(${mirror.offsetWidth}px + 0.5ch)` : '';
}
function paint(ex) {
  $('before').textContent = ex.before;
  $('after').textContent = ex.after;
  $('hint').textContent = ex.verb;
  input.value = '';
  fitInput();
  form.className = '';
  $('action').textContent = 'Vérifier';
  state.phase = 'answering';
}
function showExercise(animate) {
  const ex = nextExercise();
  state.current = ex;
  form.hidden = !ex;
  $('empty').hidden = !!ex;
  if (!ex) return;
  if (!animate) { paint(ex); input.focus(); return; }
  // The input keeps focus during the swap so the mobile keyboard stays open.
  sentence.classList.add('is-out');
  setTimeout(() => {
    paint(ex);
    sentence.classList.remove('is-out');
    sentence.classList.add('is-in');
    requestAnimationFrame(() => requestAnimationFrame(() => sentence.classList.remove('is-in')));
    input.focus();
  }, 180);
}
function check() {
  const ex = state.current;
  const typed = normalize(input.value);
  if (!typed) { shake(); return; }
  const answers = ex.answers.map(normalize);
  const f = formOf(ex.form);
  let verdict, cls, lines = [];
  if (answers.includes(typed)) {
    verdict = 'Correct'; cls = 'is-correct';
  } else if (answers.map(stripAccents).includes(stripAccents(typed))) {
    verdict = 'Presque : attention aux accents'; cls = 'is-almost';
  } else {
    verdict = 'Incorrect'; cls = 'is-wrong';
    const alt = Object.entries(ex.alts || {}).find(([k]) => normalize(k) === typed);
    if (alt) lines.push(`« ${input.value.trim()} » est ${alt[1]}.`);
  }
  lines.push(`${fullLabel(f)}. ${ex.cue}`);
  $('verdict').textContent = verdict;
  $('correct').textContent = cls === 'is-correct' ? '' : ex.answers[0];
  $('why').replaceChildren(...lines.map((t) => Object.assign(document.createElement('p'), { textContent: t })));
  form.className = `is-checked ${cls}`;
  if (cls === 'is-wrong') shake();
  $('action').textContent = 'Continuer';
  state.phase = 'checked';
  state.total += 1;
  if (cls === 'is-correct') state.right += 1;
  $('score').textContent = `${state.right} / ${state.total}`;
}
function shake() {
  form.classList.remove('is-shaking');
  void form.offsetWidth;
  form.classList.add('is-shaking');
}

form.addEventListener('submit', (e) => {   // Enter in the field, or the button
  e.preventDefault();
  if (state.phase === 'answering') check(); else showExercise(true);
  input.focus();
});
input.addEventListener('input', fitInput);
input.addEventListener('beforeinput', (e) => { 
  // Lock the text once checked, but let Enter through: it submits the form.
  if (state.phase === 'checked' && e.inputType !== 'insertLineBreak') e.preventDefault();
});
// The button must not take focus away from the field.
$('action').addEventListener('pointerdown', (e) => e.preventDefault());

// ---------- Settings ----------
function chip(label, pressed, onToggle) {
  const b = Object.assign(document.createElement('button'), { type: 'button', className: 'chip', textContent: label });
  b.setAttribute('aria-pressed', pressed);
  b.addEventListener('click', () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    onToggle(on);
  });
  return b;
}
function toggle(set, key) { return (on) => { on ? set.add(key) : set.delete(key); }; }
function renderSettings() {
  $('forms').replaceChildren(...['Indicatif', 'Subjonctif'].map((mood) => {
    const g = Object.assign(document.createElement('div'), { className: 'group' });
    const chips = Object.assign(document.createElement('div'), { className: 'chips' });
    chips.append(...FORMS.filter((f) => f.mood === mood).map((f) => chip(f.label, state.forms.has(f.id), toggle(state.forms, f.id))));
    g.append(Object.assign(document.createElement('span'), { className: 't-caption', textContent: mood }), chips);
    return g;
  }));
  $('verbs').replaceChildren(...VERBS.map((v) => chip(v, state.verbs.has(v), toggle(state.verbs, v))));
}
document.querySelectorAll('[data-all]').forEach((b) => b.addEventListener('click', () => {
  state.verbs = new Set(b.dataset.all === '1' ? VERBS : []);
  renderSettings();
}));

// ---------- Progress (mocked numbers) ----------
function mockScore(v, f) {            // stable pseudo-random 35–100
  let h = 7; for (const c of v + f) h = (h * 31 + c.charCodeAt(0)) % 9973;
  const bias = f.startsWith('subj') ? -14 : 0;
  return Math.max(35, Math.min(100, 62 + (h % 39) + bias));
}
function renderProgress() {
  const cells = VERBS.flatMap((v) => FORMS.map((f) => ({ v, f, score: mockScore(v, f.id) })));
  const avg = Math.round(cells.reduce((a, c) => a + c.score, 0) / cells.length);
  $('summary').textContent = `${1284 + state.total} réponses, ${avg} % justes.`;
  $('weak').replaceChildren(...cells.slice().sort((a, b) => a.score - b.score).slice(0, 5).map((c) => {
    const li = document.createElement('li');
    li.append(
      Object.assign(document.createElement('span'), { textContent: c.v }),
      Object.assign(document.createElement('span'), { textContent: fullLabel(c.f).toLowerCase() }),
      Object.assign(document.createElement('span'), { textContent: `${c.score} %` }),
    );
    return li;
  }));
  const head = `<tr><th scope="col">Verbe</th>${FORMS.map((f) => `<th scope="col" title="${fullLabel(f)}">${f.short}</th>`).join('')}</tr>`;
  const rows = VERBS.map((v) => `<tr><td>${v}</td>${FORMS.map((f) => `<td>${mockScore(v, f.id)}</td>`).join('')}</tr>`).join('');
  $('matrix').innerHTML = head + rows;
}

// ---------- Navigation ----------
let currentView = 'practice';
function go(name) {
  if (name === currentView) return;
  const from = $(`view-${currentView}`), to = $(`view-${name}`);
  document.querySelectorAll('nav button').forEach((b) => b.toggleAttribute('aria-current', false));
  document.querySelector(`nav [data-view="${name}"]`).setAttribute('aria-current', 'page');
  currentView = name;
  from.classList.add('is-leaving');
  setTimeout(() => {
    from.hidden = true; from.classList.remove('is-leaving');
    if (name === 'settings') renderSettings();
    if (name === 'progress') renderProgress();
    to.classList.add('is-entering'); to.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => to.classList.remove('is-entering')));
    if (name === 'practice') {
      // Settings may have changed the pool: keep the exercise if still valid.
      if (!state.current || !pool().includes(state.current)) showExercise(false);
      else input.focus();
    }
  }, 200);
}
document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => go(b.dataset.view)));

showExercise(false);
</script>
</body>
</html>
